apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'expo.modules.colorizer'
version = '1.0.0'

android {
  namespace 'expo.modules.colorizer'
  compileSdk rootProject.ext.compileSdkVersion

  defaultConfig {
    minSdk rootProject.ext.minSdkVersion
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation project(':expo-modules-core')
  // Runs DDColor-L on the CPU. The model itself is downloaded on first use (ModelStore.kt).
  // Our reduced build without telemetry from ort-maven (see the root build.gradle). The version is
  // ours alone, so a missing ort-maven repository fails the build instead of resolving the stock
  // library from Maven Central.
  implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0-pastvu'
}
