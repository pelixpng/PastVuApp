// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    // PastVu: our own size-reduced ONNX Runtime (modules/colorizer/android/ort-maven, built with
    // only the colorizer model's ops and without Microsoft telemetry). Its version, 1.30.0-pastvu,
    // exists nowhere else, so a build without this repository fails instead of falling back to the
    // stock library with telemetry, and exclusiveContent makes this repository the only one Gradle
    // asks for onnxruntime-android. Keep it after prebuild.
    exclusiveContent {
      forRepository { maven { url = uri("${rootDir}/../modules/colorizer/android/ort-maven") } }
      filter { includeModule('com.microsoft.onnxruntime', 'onnxruntime-android') }
    }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
